<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboards</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboards.css">
    <style>
        .action-cell { width: 40px; text-align: center; }
        .send-command-btn { padding: 0; cursor: pointer; width: 32px; height: 32px; line-height: 32px; text-align: center; font-size: 18px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
        .send-command-btn:hover { background: #e0e0e0; }
        .toggleable { cursor: pointer; }
        .pending { opacity: 0.5; }
        .value-cell input, .value-cell select { padding: 4px; border: 1px solid #ddd; border-radius: 4px; width: 100px; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <ul>
                <li><a href="/" class="active">Dashboards</a></li>
                <li><a href="status.html">Device Status</a></li>
                <li><a href="manager.html">Device Manager</a></li>
                <li><a href="graph.html">Data Graph</a></li>
            </ul>
        </nav>
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin: 0;">Dashboards</h1>
            <a href="#" onclick="showCreate(); return false;" style="color: #666; text-decoration: none; font-size: 0.9em;">+ New Dashboard</a>
        </header>

        <div id="listSection">
            <div id="dashboardNav" class="dashboard-nav"></div>
            <div id="activeDashboards"></div>
        </div>

        <div id="editSection">
            <h2 id="editTitle">Edit Dashboard</h2>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="editName">
            </div>
            
            <label>Metrics</label>
            <div id="editMetricsList"></div>
            
            <div style="background: #f8f9fa; padding: 15px; border-radius: 4px; margin-top: 10px;">
                <h4>Add Metric</h4>
                <div class="form-group">
                    <label>Device</label>
                    <select id="deviceSelect"></select>
                </div>
                <div class="form-group">
                    <label>Key</label>
                    <select id="keySelect" disabled><option>Select a device first</option></select>
                </div>
                <button class="btn btn-secondary" onclick="addMetricFromSelect()">Add to List</button>
            </div>

            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-secondary" onclick="showList()">Cancel</button>
                <button class="btn btn-danger" id="btnDelete" onclick="deleteCurrent()" style="display:none;">Delete</button>
                <button class="btn btn-primary" onclick="saveCurrent()">Save</button>
            </div>
        </div>
    </div>

    <script src="js/dashboards.js"></script>
</body>
</html>
