<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/manager.css">
    <link rel="stylesheet" href="css/manager_latest.css">
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <ul>
                <li><a href="status.html">Device Status</a></li>
                <li><a href="manager.html" class="active">Device Manager</a></li>
                <li><a href="graph_all.html">Data Graph</a></li>
                <li><a href="dashboards.html">Dashboards</a></li>
            </ul>
        </nav>
        <header>
            <h1>Device Manager</h1>
        </header>

        <div id="deviceList" class="device-nav"></div>

        <div id="deviceStats" class="stats-container hidden">
            <div class="stats-grid">
                <div><strong>Last Seen:</strong><br><span id="statLastSeen">-</span></div>
                <div><strong>Total Records:</strong><br><span id="statTotal">-</span></div>
                <div><strong>Records Today:</strong><br><span id="statToday">-</span></div>
                <div><strong>Daily:</strong><br><span id="statAvg">-</span></div>
            </div>
        </div>

        <div id="deviceActions" class="stats-container hidden">
            <h3>Automation / Actions</h3>
            <div id="actionsList"></div>
        </div>

        <div id="latestDataSection" class="hidden">
            <div class="stats-container">
                <div class="latest-data-header">
                    <h3>Latest Data Received</h3>
                </div>
                <table>
                    <tbody id="latestDataBody"></tbody>
                </table>
            </div>
        </div>

    </div>
    <script src="js/utils.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/manager_latest.js"></script>
</body>
</html>
